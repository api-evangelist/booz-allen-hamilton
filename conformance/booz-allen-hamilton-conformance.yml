method: searched
source: >-
  Agent Foundry docs (github.com/boozallen/strands-base-agent/blob/develop/docs/foundry/),
  security/stig_checklist.json in the same repo, boozallen.com compliance pages — read 2026-09-14
note: >-
  Booz Allen's conformance story is a defense-contractor one, not a web-API one: no OAuth, no
  OpenID Connect, no RFC 9457, no FHIR/FAPI/SCIM/OData. What it does implement, and publishes
  evidence for, is the agent-interop stack (A2A, MCP, JSON-RPC 2.0, SSE) and a machine-readable
  DISA STIG assessment of its agent baseline.
conformance:
  - id: a2a
    name: Agent2Agent (A2A) protocol
    conforms: true
    evidence: https://github.com/boozallen/strands-base-agent/blob/develop/docs/foundry/guides/a2a-protocol.md
    detail: >-
      The strands-base-agent baseline mounts a full A2A server via strands.multiagent.a2a.A2AServer —
      /.well-known/agent-card.json discovery, a JSON-RPC endpoint implementing message/send,
      message/stream, tasks/get, tasks/cancel and the four tasks/pushNotificationConfig methods, plus
      an optional /agent/authenticatedExtendedCard. The card is built at boot with capabilities as an
      object ({"streaming": true}) and skills as an array (one per registered tool). Note this is a
      conformance claim about SOFTWARE BOOZ ALLEN SHIPS — Booz Allen itself serves no agent card on
      any of its own hosts (see well-known/booz-allen-hamilton-well-known.yml).
    gaps:
      - 'The documented example card omits protocolVersion and preferredTransport.'
      - 'tasks/pushNotificationConfig/* return -32601 in the default build (no push_config_store).'
  - id: mcp
    name: Model Context Protocol (client)
    conforms: true
    role: client
    evidence: https://github.com/boozallen/strands-base-agent/blob/develop/docs/foundry/guides/mcp-servers.md
    detail: The agent consumes remote MCP servers declared in config.yaml; it publishes none.
  - id: jsonrpc2
    name: JSON-RPC 2.0
    conforms: true
    evidence: https://github.com/boozallen/strands-base-agent/blob/develop/docs/foundry/guides/a2a-protocol.md
    detail: A2A methods are dispatched through a single endpoint using JSON-RPC 2.0; -32601 is returned for unwired methods.
  - id: sse
    name: Server-Sent Events (WHATWG)
    conforms: true
    evidence: https://github.com/boozallen/strands-base-agent/blob/develop/docs/foundry/guides/http-api.md
    detail: 'POST /api/v1/query/stream returns text/event-stream with named events token/result/done/error/event.'
  - id: semver
    name: Semantic Versioning 2.0.0
    conforms: true
