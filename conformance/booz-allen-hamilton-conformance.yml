domain_standards:
  - id: disa-asd-stig
    name: DISA Application Security and Development (ASD) STIG / SRG
    conforms: partial
    evidence: https://github.com/boozallen/strands-base-agent/blob/develop/security/stig_checklist.json
    detail: >-
      A machine-readable, per-control assessment of the agent baseline shipped in the repo, keyed on
      DISA vuln_id / rule_id / stig_id (e.g. V-222401, SV-222401r960759_rule, SRG-APP-000001).
      assessment.assessed_by "foundry-stigkit", assessment_date 2026-06-22, 286 findings across the
      session/auth/authz/crypto/validation/audit/data domains. Status split as published:
      187 not_applicable, 72 needs_human_review, 20 meets_requirement, 7 non_compliant;
      responsibility split 227 baseline / 38 delivery / 21 shared. Booz Allen describes it as a
      "recommended template, not a hard requirement" for adopters pursuing ATO.
    why_this_is_the_domain_standard: >-
      This is the federal defense-software market's own conformance language. A buyer inside an ATO
      process reads a STIG checklist natively; anything else needs a bespoke mapping. It is the
      market-appropriate equivalent of a FHIR profile in health or PSD2 in banking.
  - id: open-inference-protocol
    name: Open Inference Protocol (OIP / KServe v2 predict)
    conforms: true
    evidence: https://github.com/boozallen/aissemble-inference
    detail: >-
      aiSSEMBLE Inference exists to "promote interoperability across diverse inference runtimes and
      platforms by adhering to the consistent OIP API specification for inference", and ships a client
      library (aissemble-inference-core on PyPI, 1.5.0, 2026-02-04) to invoke OIP endpoints. The OIP
      contract itself is the standard body's, not Booz Allen's, so nothing is saved to grpc/ here.
