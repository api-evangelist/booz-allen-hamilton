apis:
- aid: booz-allen-hamilton:booz-allen-hamilton-agent-foundry-strands-base-agent
  name: Agent Foundry — Strands Base Agent API
  description: 'The HTTP and A2A surface of Booz Allen''s Agent Foundry agent baseline, an Apache-2.0
    composition root that teams fork and deploy in their own environment. It serves three REST groups
    — /api/v1/query (sync and SSE-streaming agent queries), /api/v1/chat/history (CRUD over persisted
    sessions) and /api/v1/health — alongside a full Agent2Agent protocol server (/.well-known/agent-card.json
    plus a JSON-RPC endpoint carrying message/send, message/stream, tasks/get and tasks/cancel) on the
    same FastAPI app. It is also an MCP client: remote MCP servers are declared in config.yaml and their
    tools are discovered automatically. Self-hosted — Booz Allen operates no instance, so the base URL
    is whatever host the adopter deploys to.'
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/booz-allen-hamilton.png
  humanURL: https://boozallen.github.io/agent-foundry/
