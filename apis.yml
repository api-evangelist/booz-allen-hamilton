- aid: booz-allen-hamilton:booz-allen-hamilton-palm
  name: PALM Prompt Library API
  description: 'The published OpenAPI of PALM (Prompt & Agent Library Marketplace), Booz Allen''s model-agnostic
    enterprise LLM chat and agent platform. The document is real but minimal — one operation, POST /user-story,
    which generates a user story with a value statement and acceptance criteria. The rest of PALM''s surface
    runs over tRPC inside the Next.js application and is not described by any published machine-readable
    contract. Self-hosted: the spec''s server is the relative path /api on whatever origin the adopter
    deploys PALM to.'
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/booz-allen-hamilton.png
  humanURL: https://github.com/boozallen/palm
