note: >-
  No rate limits are published and none would be meaningful: the only Booz Allen service with a
  documented HTTP contract is self-hosted by the adopter, who sets their own capacity. No
  RateLimit-*/X-RateLimit-*/Retry-After headers are documented and 429 does not appear among the
  statuses the error middleware returns (400 / 404 / 422 / 500). An agent calling a deployed fork
  gets no runtime throttling signal at all.
