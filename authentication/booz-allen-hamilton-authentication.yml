summary: >-
  There is no authentication to document for a Booz Allen API, because there is no Booz Allen API
  to call. Both published contracts in the estate are for self-hosted software: the PALM
  openapi-specification.yaml declares no components.securitySchemes at all, and the Agent Foundry
  strands-base-agent baseline mounts its REST and A2A routes with no authn/authz layer, leaving
  both to the adopter's deployment. This file records that measured absence — it is deliberately
  NOT wired as an `Authentication` pointer in apis.yml, because crediting a documented auth model
  here would assert a posture neither product has.
